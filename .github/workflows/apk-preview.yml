name: APK preview artifact only
on:
  push:
    branches: [agent/halaly-1.0.136-mating-and-ui]
    paths: [.github/workflows/apk-preview.yml, scripts/verify-preview.mjs]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare and test
        run: |
          test -d "$ANDROID_HOME/platforms/android-35" || { echo 'Required preinstalled SDK 35 unavailable; no SDK installation or license acceptance attempted.'; exit 1; }
          npm install
          npm test
          curl --fail --location --retry 2 https://github.com/alaoufi/Hlaly/releases/download/apk-latest/hlaly.apk -o previous.apk
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          PREVIOUS_CODE=$("$BT/aapt" dump badging previous.apk | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          test -n "$PREVIOUS_CODE"
          echo "PREVIEW_CODE=$((PREVIOUS_CODE + 1))" >> "$GITHUB_ENV"
          echo "APP_VERSION=1.0.$((PREVIOUS_CODE + 1))-preview" >> "$GITHUB_ENV"
      - name: Generate Capacitor Android project in disposable runner
        run: |
          npm run build:www
          rm -rf android
          npx cap add android
          node scripts/make-icons.mjs
          npx @capacitor/assets generate --android
          sed -i "s/versionName \"[^\"]*\"/versionName \"$APP_VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $PREVIEW_CODE/" android/app/build.gradle
          sed -i -E 's/(compileSdkVersion =) *[0-9]+/\1 35/; s/(targetSdkVersion =) *[0-9]+/\1 35/; s/(minSdkVersion =) *[0-9]+/\1 23/' android/variables.gradle
          npx cap sync android
      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Sign with existing project configuration and verify compatibility
        run: node scripts/verify-preview.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: hlaly-vaccinations-preview
          path: |
            preview-output/hlaly-preview.apk
            preview-output/verification.json
          if-no-files-found: error
          retention-days: 7
